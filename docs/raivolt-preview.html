<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>RAIVOLT — Ciborgues ilustrados</title><style>body{margin:0;padding:24px;background:#10152b;color:#e8eff5;font:15px system-ui;text-align:center}header img{width:360px;max-width:80%}h1{font-size:18px;letter-spacing:4px;margin:12px}p{color:#a9b6c9}nav{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin:24px}select{background:#1a2537;color:#e8eff5;border:1px solid #52687e;border-radius:0;padding:9px;margin-left:8px}section{display:grid;grid-template-columns:repeat(4,minmax(0,180px));gap:14px;justify-content:center;margin:24px auto}article{background:#20243c;border:1px solid #3e4f65;border-radius:0;padding:8px 0 18px}canvas{image-rendering:pixelated;width:160px;max-width:100%;height:190px;object-fit:contain}b{display:block;font-size:17px;letter-spacing:1px}a{color:#89dbdf}@media(max-width:650px){section{grid-template-columns:repeat(2,minmax(0,180px))}}</style><header><img src="/raivolt-logo.png" alt="RAIVOLT"></header><h1>CIBORGUES • ARCADE 16-BIT</h1><p>Pixels nítidos · Cores limitadas · Sombras em blocos</p><nav><label>Direção<select id="direction"><option value="down">Frente</option><option value="right">Direita</option><option value="up">Costas</option><option value="left">Esquerda</option></select></label><label>Animação<select id="mood"><option value="walk">Caminhada</option><option value="idle">Parado</option><option value="winner">Vitória</option></select></label></nav><section id="roster"></section><a href="/docs/raivolt-map-preview.html">Ver na arena →</a><script type="module">
import {CHARACTERS,drawCyborg} from '/client/identity.js';
const cards=CHARACTERS.map(p=>{const a=document.createElement('article'),c=document.createElement('canvas'),b=document.createElement('b');c.width=224;c.height=280;b.textContent=p.name;a.append(c,b);document.querySelector('#roster').append(a);const ctx=c.getContext('2d');ctx.scale(4,4);return [ctx,p]});
const direction=document.querySelector('#direction'),mood=document.querySelector('#mood');
function frame(now){for(const [ctx,p] of cards){ctx.clearRect(0,0,56,70);drawCyborg(ctx,28,45,p,{direction:direction.value,frame:Math.floor(now/125)%8,moving:mood.value!=='idle',mood:mood.value==='winner'?'winner':'idle'});}requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>

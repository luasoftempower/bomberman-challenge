<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>RAIVOLT — Arena elétrica</title><style>body{margin:0;padding:22px;background:#10152b;color:#e4faff;font:15px system-ui;text-align:center}header img{width:330px;max-width:80%}h1{font-size:16px;letter-spacing:4px}canvas{display:block;width:min(780px,96%);height:auto;image-rendering:pixelated;margin:22px auto;box-shadow:0 0 45px #4b8bdd22;border:1px solid #546080;border-radius:0}p{color:#adbed5}a{color:#6ef6ff}</style><header><img src="/raivolt-logo.png" alt="RAIVOLT"></header><h1>SUBESTAÇÃO • ARENA ELÉTRICA</h1><p>Aço azul · Cobre · Arcade 16-bit</p><canvas id="arena" aria-label="Prévia da arena elétrica"></canvas><a href="/">Entrar no jogo →</a><script type="module">
import {renderGame} from '/client/render.js';
const grid=Array.from({length:143},(_,i)=>{const x=i%13,y=Math.floor(i/13);return x===0||y===0||x===12||y===10||x%2===0&&y%2===0?'#':(x*7+y*11)%5<2?'o':'.'});
for(const [x,y] of [[1,1],[2,1],[3,1],[1,2],[1,3],[5,5],[6,5],[7,5],[8,5],[9,5],[7,4],[7,6],[11,9],[10,9],[11,8]])grid[y*13+x]='.';
const state={grid:grid.join(''),players:[{id:'preview-ion',slot:0,name:'Íon',x:60,y:60,alive:true},{id:'preview-arco',slot:5,name:'Arco',x:460,y:380,alive:true}],bombs:[{x:3,y:1,fuse:1.3}],blasts:[{x:5,y:5},{x:6,y:5},{x:7,y:5},{x:8,y:5},{x:9,y:5},{x:7,y:4},{x:7,y:6}]};
function frame(now){state.blasts.forEach(b=>b.ttl=.4-((now/1000)%1.6)/4);renderGame(document.querySelector('#arena'),state);requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
